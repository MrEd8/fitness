<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Max Fitness - Hypertrofie & PPL</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Max Fitness">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      overscroll-behavior-y: none;
      background-color: #000000;
    }
    input[type=number], input[type=text] { -webkit-appearance: none; margin: 0; font-size: 16px !important; }
    
    .sticky-header { 
      position: sticky; 
      top: 0; 
      z-index: 40; 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px); 
      padding-top: calc(env(safe-area-inset-top, 48px) + 8px) !important;
      padding-bottom: 12px !important;
    }
    
    .bottom-nav { 
      padding-top: 8px !important;
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 10px) !important; 
    }
    
    .safe-bottom-spacer { 
      height: calc(90px + env(safe-area-inset-bottom, 20px)); 
    }
    
    /* Plynulá animace kroužků */
    circle.progress-ring {
      transition: stroke-dashoffset 1s ease-in-out;
    }
  </style>
</head>
<body class="bg-black text-white antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, memo } = React;

    const STORAGE_KEY_EX = 'mf_exercises_v7';
    const STORAGE_KEY_WORKOUT = 'mf_active_workout_v7';
    const STORAGE_KEY_HISTORY = 'mf_history_v7';
    const STORAGE_KEY_NOTES = 'mf_notes_v7';
    
    const INITIAL_EXERCISES = [
      { id: 'bp', name: 'Bench Press (velká činka)', category: 'push', muscleGroup: 'Hrudník', isAnchor: true, isCounterweight: false, repsTarget: '6-8' },
      { id: 'db_incline', name: 'Tlaky jednoručkami na šikmé lavici', category: 'push', muscleGroup: 'Hrudník', isAnchor: false, isCounterweight: false, repsTarget: '8-10' },
      { id: 'dips_chest', name: 'Bradla na hrudník s dopomocí', category: 'push', muscleGroup: 'Hrudník', isAnchor: false, isCounterweight: true, repsTarget: '8-12' },
      { id: 'cable_crossover', name: 'Protisměrné kladky na prsa', category: 'push', muscleGroup: 'Hrudník', isAnchor: false, isCounterweight: false, repsTarget: '12-15' },
      { id: 'db_shoulder_press', name: 'Tlaky s jednoručkami vsedě na ramena', category: 'push', muscleGroup: 'Ramena', isAnchor: false, isCounterweight: false, repsTarget: '8-10' },
      { id: 'lat_raise', name: 'Upažování s jednoručkami ve stoji', category: 'push', muscleGroup: 'Ramena', isAnchor: false, isCounterweight: false, repsTarget: '12-15' },
      { id: 'cable_lat_raise', name: 'Upažování na spodní kladce za tělem', category: 'push', muscleGroup: 'Ramena', isAnchor: false, isCounterweight: false, repsTarget: '12-15' },
      { id: 'tri_pushdown', name: 'Triceps na kladce (lano)', category: 'push', muscleGroup: 'Triceps', isAnchor: false, isCounterweight: false, repsTarget: '10-12' },
      { id: 'tri_overhead', name: 'Tricepsové extenze nad hlavou na kladce', category: 'push', muscleGroup: 'Triceps', isAnchor: false, isCounterweight: false, repsTarget: '10-12' },
      { id: 'close_grip_bench', name: 'Úzký bench press na triceps', category: 'push', muscleGroup: 'Triceps', isAnchor: false, isCounterweight: false, repsTarget: '8-10' },
      { id: 'pullup', name: 'Shyby na stroji s dopomocí', category: 'pull', muscleGroup: 'Záda', isAnchor: true, isCounterweight: true, repsTarget: '6-8' },
      { id: 'barbell_row', name: 'Přítahy velké činky v předklonu', category: 'pull', muscleGroup: 'Záda', isAnchor: false, isCounterweight: false, repsTarget: '8-10' },
      { id: 'lat_pulldown', name: 'Stahování horní kladky na hrudník', category: 'pull', muscleGroup: 'Záda', isAnchor: false, isCounterweight: false, repsTarget: '10-12' },
      { id: 'chest_supported_row', name: 'Přítahy na stroji s oporou hrudníku', category: 'pull', muscleGroup: 'Záda', isAnchor: false, isCounterweight: false, repsTarget: '10-12' },
      { id: 'facepull', name: 'Facepulls na horní kladce', category: 'pull', muscleGroup: 'Zadní ramena', isAnchor: false, isCounterweight: false, repsTarget: '12-15' },
      { id: 'rear_delt_fly', name: 'Zapažování na peck-deck stroji', category: 'pull', muscleGroup: 'Zadní ramena', isAnchor: false, isCounterweight: false, repsTarget: '12-15' },
      { id: 'biceps_ez', name: 'Biceps zdvihy s EZ osou vestoje', category: 'pull', muscleGroup: 'Biceps', isAnchor: false, isCounterweight: false, repsTarget: '8-10' },
      { id: 'incline_db_curl', name: 'Biceps zdvihy na šikmé lavici', category: 'pull', muscleGroup: 'Biceps', isAnchor: false, isCounterweight: false, repsTarget: '10-12' },
      { id: 'hammer_curl', name: 'Kladivové zdvihy s jednoručkami', category: 'pull', muscleGroup: 'Biceps', isAnchor: false, isCounterweight: false, repsTarget: '10-12' },
      { id: 'preacher_curl', name: 'Biceps zdvih na Scottově lavici', category: 'pull', muscleGroup: 'Biceps', isAnchor: false, isCounterweight: false, repsTarget: '10-12' },
      { id: 'squat', name: 'Dřep s velkou činkou na zádech', category: 'legs', muscleGroup: 'Kvadricepsy', isAnchor: true, isCounterweight: false, repsTarget: '6-8' },
      { id: 'leg_press', name: 'Leg Press pod úhlem 45°', category: 'legs', muscleGroup: 'Kvadricepsy', isAnchor: false, isCounterweight: false, repsTarget: '10-12' },
      { id: 'leg_ext', name: 'Předkopávání na stroji', category: 'legs', muscleGroup: 'Kvadricepsy', isAnchor: false, isCounterweight: false, repsTarget: '12-15' },
      { id: 'romanian_dl', name: 'Rumunský mrtvý tah s jednoručkami', category: 'legs', muscleGroup: 'Hamstringy', isAnchor: false, isCounterweight: false, repsTarget: '8-10' },
      { id: 'lying_leg_curl', name: 'Zakopávání na stroji vleže', category: 'legs', muscleGroup: 'Hamstringy', isAnchor: false, isCounterweight: false, repsTarget: '10-12' },
      { id: 'seated_leg_curl', name: 'Zakopávání na stroji vsedě', category: 'legs', muscleGroup: 'Hamstringy', isAnchor: false, isCounterweight: false, repsTarget: '10-12' },
      { id: 'calf_standing', name: 'Výpony na lýtka vestoje na stroji', category: 'legs', muscleGroup: 'Lýtka', isAnchor: false, isCounterweight: false, repsTarget: '12-15' },
      { id: 'calf_seated', name: 'Výpony na lýtka vsedě', category: 'legs', muscleGroup: 'Lýtka', isAnchor: false, isCounterweight: false, repsTarget: '15-20' }
    ];

    const SetRow = memo(({ s, sIdx, exId, isCounterweight, stepWeight, onWeightChange, onRepsChange, onRemove, onRpeChange, theme }) => {
      const isDark = theme === 'dark';
      
      const handleWeightInput = (e) => {
        let valStr = e.target.value.replace(',', '.');
        let val = parseFloat(valStr);
        if (isNaN(val)) val = 0;
        onWeightChange(exId, s.id, val, true);
      };

      const handleRepsInput = (e) => {
        let val = parseInt(e.target.value, 10);
        if (isNaN(val)) val = 0;
        onRepsChange(exId, s.id, val, true);
      };

      return (
        <div className={`p-3 rounded-2xl ${isDark ? 'bg-[#2C2C2E]' : 'bg-zinc-100'} space-y-2`}>
          <div className="flex items-center justify-between text-xs font-semibold">
            <span className="text-zinc-400 uppercase tracking-wider text-[11px]">SÉRIE {sIdx + 1}</span>
            <button type="button" onClick={() => onRemove(exId, s.id)} className="text-[12px] text-zinc-400 hover:text-red-400 font-bold px-3 py-2 -mr-3 -mt-2">✕ Odstranit</button>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <div className={`p-2 rounded-xl border flex flex-col items-center justify-between ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-zinc-200'}`}>
              <span className="text-[10px] text-zinc-400 font-bold uppercase">{isCounterweight ? 'Protiváha (kg)' : 'Váha (kg)'}</span>
              <div className="flex items-center justify-between w-full mt-1">
                <button type="button" onClick={() => onWeightChange(exId, s.id, -stepWeight, false)} className="w-12 h-12 rounded-xl bg-zinc-800 text-white font-bold text-xl active:scale-95">-</button>
                <input type="text" inputMode="decimal" pattern="[0-9]*[.,]?[0-9]*" value={s.weight === 0 ? '' : s.weight} placeholder="0" onFocus={(e) => e.target.select()} onChange={handleWeightInput} className="w-16 text-center font-bold text-lg bg-transparent text-orange-400 outline-none" />
                <button type="button" onClick={() => onWeightChange(exId, s.id, stepWeight, false)} className="w-12 h-12 rounded-xl bg-zinc-800 text-white font-bold text-xl active:scale-95">+</button>
              </div>
            </div>

            <div className={`p-2 rounded-xl border flex flex-col items-center justify-between ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-zinc-200'}`}>
              <span className="text-[10px] text-zinc-400 font-bold uppercase">Opakování</span>
              <div className="flex items-center justify-between w-full mt-1">
                <button type="button" onClick={() => onRepsChange(exId, s.id, -1, false)} className="w-12 h-12 rounded-xl bg-zinc-800 text-white font-bold text-xl active:scale-95">-</button>
                <input type="number" inputMode="numeric" pattern="[0-9]*" value={s.reps === 0 ? '' : s.reps} placeholder="0" onFocus={(e) => e.target.select()} onChange={handleRepsInput} className="w-14 text-center font-bold text-lg bg-transparent text-white outline-none" />
                <button type="button" onClick={() => onRepsChange(exId, s.id, 1, false)} className="w-12 h-12 rounded-xl bg-zinc-800 text-white font-bold text-xl active:scale-95">+</button>
              </div>
            </div>
          </div>

          <div className="flex gap-1 pt-1 justify-end">
            {['Lehké', 'Akorát', 'Na krev'].map(tag => (
              <button
                key={tag} type="button" onClick={() => onRpeChange(exId, s.id, tag)}
                className={`px-3 py-1.5 rounded-lg text-[11px] font-semibold transition-colors ${s.rpe === tag ? 'bg-orange-500 text-white' : 'text-zinc-400 bg-zinc-800/60'}`}
              >
                {tag}
              </button>
            ))}
          </div>
        </div>
      );
    });
    
    // KOMPONENTA PRO PROGRESS KROUŽKY (Apple Style)
    const ProgressRings = ({ history }) => {
      // Zjistíme unikátní dny cvičení v posledních 7 dnech
      const now = new Date();
      const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      
      const recentWorkouts = history.filter(h => new Date(h.date) >= weekAgo);
      const uniqueDays = new Set(recentWorkouts.map(h => new Date(h.date).toDateString())).size;
      
      const saunas = recentWorkouts.filter(h => h.sauna?.used).length;
      
      // Výpočet zvednutých vah (orientační objem = váha * opáčka u všech nedopomocných cviků)
      let recentVolume = 0;
      let prevVolume = 0;
      
      history.forEach(h => {
          const wDate = new Date(h.date);
          let vol = 0;
          h.exercises.forEach(ex => {
              if(!ex.isCounterweight) {
                  ex.sets.forEach(s => { vol += (s.weight * s.reps); });
              }
          });
          
          if (wDate >= weekAgo) {
              recentVolume += vol;
          } else if (wDate >= new Date(weekAgo.getTime() - 7 * 24 * 60 * 60 * 1000) && wDate < weekAgo) {
              prevVolume += vol;
          }
      });
      
      const volTrend = prevVolume === 0 ? 100 : Math.min(100, Math.round((recentVolume / prevVolume) * 100));

      const rings = [
        { label: 'Tréninky / týden', color: '#ff9500', current: uniqueDays, target: 4, unit: 'dní' },
        { label: 'Objem vs minule', color: '#34c759', current: volTrend, target: 100, unit: '%' },
        { label: 'Sauna / týden', color: '#32ade6', current: saunas, target: 2, unit: 'x' }
      ];

      return (
        <div className="flex flex-col items-center justify-center p-4">
          <div className="relative w-48 h-48">
            {rings.map((ring, index) => {
              const radius = 80 - (index * 22);
              const circumference = 2 * Math.PI * radius;
              // Výpočet procenta (max 100%)
              const percent = Math.min(100, Math.max(0, (ring.current / ring.target) * 100));
              const offset = circumference - (percent / 100) * circumference;
              
              return (
                <svg key={index} className="absolute top-0 left-0 w-full h-full transform -rotate-90">
                  {/* Track */}
                  <circle
                    cx="96" cy="96" r={radius}
                    stroke={ring.color} strokeWidth="18" fill="none"
                    opacity="0.15" strokeLinecap="round"
                  />
                  {/* Progress (s plynulou CSS animací) */}
                  <circle
                    className="progress-ring"
                    cx="96" cy="96" r={radius}
                    stroke={ring.color} strokeWidth="18" fill="none"
                    strokeLinecap="round"
                    strokeDasharray={circumference}
                    strokeDashoffset={offset}
                  />
                </svg>
              );
            })}
          </div>
          
          {/* Legenda kroužků */}
          <div className="mt-8 space-y-3 w-full">
            {rings.map((r, idx) => (
               <div key={idx} className="flex justify-between items-center bg-zinc-900/50 p-3 rounded-2xl">
                 <div className="flex items-center gap-2">
                   <div className="w-3 h-3 rounded-full" style={{backgroundColor: r.color}}></div>
                   <span className="text-xs font-bold text-zinc-300">{r.label}</span>
                 </div>
                 <span className="text-sm font-black" style={{color: r.color}}>{r.current} <span className="text-xs text-zinc-500 font-semibold">{r.unit}</span></span>
               </div>
            ))}
          </div>
        </div>
      );
    };

    function App() {
      const [tab, setTab] = useState('workout');
      // Výchozí split při zapnutí appky
      const [split, setSplit] = useState('push');
      const [stepWeight, setStepWeight] = useState(0.5);
      const [theme, setTheme] = useState('dark');
      
      const [exerciseNotes, setExerciseNotes] = useState(() => {
         const saved = localStorage.getItem(STORAGE_KEY_NOTES);
         return saved ? JSON.parse(saved) : {};
      });

      const [collapsedCards, setCollapsedCards] = useState({});
      const [saunaUsed, setSaunaUsed] = useState(false);
      const [saunaMins, setSaunaMins] = useState('');

      const [addModal, setAddModal] = useState(false);
      const [wandModal, setWandModal] = useState(false);
      const [confirmDialog, setConfirmDialog] = useState(null);
      const [toastMsg, setToastMsg] = useState('');
      
      const [editHistoryModal, setEditHistoryModal] = useState(null);
      const fileInputRef = useRef(null);
      
      const [customName, setCustomName] = useState('');
      const [customCategory, setCustomCategory] = useState('push');
      const [customMuscle, setCustomMuscle] = useState('Hrudník');
      const [customIsCounterweight, setCustomIsCounterweight] = useState(false);

      const [exercises, setExercises] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_EX);
        return saved ? JSON.parse(saved) : INITIAL_EXERCISES;
      });

      const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_HISTORY);
        return saved ? JSON.parse(saved) : [];
      });

      const [workoutState, setWorkoutState] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_WORKOUT);
        if (saved) return JSON.parse(saved);
        return { push: [], pull: [], legs: [], mix: [] };
      });

      useEffect(() => { localStorage.setItem(STORAGE_KEY_EX, JSON.stringify(exercises)); }, [exercises]);
      useEffect(() => { localStorage.setItem(STORAGE_KEY_WORKOUT, JSON.stringify(workoutState)); }, [workoutState]);
      useEffect(() => { localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history)); }, [history]);
      useEffect(() => { localStorage.setItem(STORAGE_KEY_NOTES, JSON.stringify(exerciseNotes)); }, [exerciseNotes]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const toggleCardCollapse = useCallback((exId) => {
        setCollapsedCards(prev => ({ ...prev, [exId]: !prev[exId] }));
      }, []);

      const getGhostDataForExercise = (exId) => {
        for (let i = 0; i < history.length; i++) {
          const pastEx = history[i].exercises.find(e => e.id === exId);
          if (pastEx && pastEx.sets && pastEx.sets.length > 0) {
            return pastEx.sets;
          }
        }
        return null;
      };

      const handleWeightChange = useCallback((exId, setId, val, isAbsolute) => {
        setWorkoutState(prev => {
          const list = prev[split] || [];
          return {
            ...prev,
            [split]: list.map(item => item.id !== exId ? item : {
              ...item,
              sets: item.sets.map(s => {
                if (s.id !== setId) return s;
                const newWeight = isAbsolute ? val : Math.max(0, Math.round(((parseFloat(s.weight) || 0) + val) * 10) / 10);
                return { ...s, weight: newWeight };
              })
            })
          };
        });
      }, [split]);

      const handleRepsChange = useCallback((exId, setId, val, isAbsolute) => {
        setWorkoutState(prev => {
          const list = prev[split] || [];
          return {
            ...prev,
            [split]: list.map(item => item.id !== exId ? item : {
              ...item,
              sets: item.sets.map(s => {
                if (s.id !== setId) return s;
                const newReps = isAbsolute ? val : Math.max(0, (parseInt(s.reps, 10) || 0) + val);
                return { ...s, reps: newReps };
              })
            })
          };
        });
      }, [split]);

      const handleRpeChange = useCallback((exId, setId, tag) => {
         setWorkoutState(prev => {
          const list = prev[split] || [];
          return {
            ...prev,
            [split]: list.map(item => item.id !== exId ? item : {
              ...item,
              sets: item.sets.map(s => s.id !== setId ? s : { ...s, rpe: tag })
            })
          };
        });
      }, [split]);

      const addSet = useCallback((exId) => {
        setWorkoutState(prev => {
          const list = prev[split] || [];
          return {
            ...prev,
            [split]: list.map(item => {
              if (item.id !== exId) return item;
              const last = item.sets[item.sets.length - 1];
              const newId = item.sets.length > 0 ? Math.max(...item.sets.map(x => x.id)) + 1 : 1;
              return {
                ...item,
                sets: [...item.sets, { id: newId, weight: last ? last.weight : 0, reps: last ? last.reps : 0, rpe: 'Akorát' }]
              };
            })
          };
        });
      }, [split]);

      const requestRemoveSet = useCallback((exId, setId) => {
        setWorkoutState(prev => ({
            ...prev,
            [split]: (prev[split] || []).map(item => item.id !== exId ? item : {
            ...item, sets: item.sets.filter(s => s.id !== setId)
            })
        }));
      }, [split]);

      const requestRemoveExerciseFromWorkout = useCallback((exId, exName) => {
        setConfirmDialog({
          title: `Odebrat ${exName}?`,
          text: 'Tento cvik bude odebrán z dnešního tréninku.',
          confirmText: 'Odebrat',
          isDanger: true,
          onConfirm: () => {
            setWorkoutState(prev => ({
              ...prev,
              [split]: (prev[split] || []).filter(item => item.id !== exId)
            }));
            setConfirmDialog(null);
            showToast('Cvik byl odebrán.');
          }
        });
      }, [split]);
      
      const moveExercise = useCallback((exId, direction) => {
         setWorkoutState(prev => {
            const list = [...(prev[split] || [])];
            const idx = list.findIndex(item => item.id === exId);
            if (idx === -1) return prev;
            
            if (direction === 'up' && idx > 0) {
               const temp = list[idx];
               list[idx] = list[idx - 1];
               list[idx - 1] = temp;
            } else if (direction === 'down' && idx < list.length - 1) {
               const temp = list[idx];
               list[idx] = list[idx + 1];
               list[idx + 1] = temp;
            }
            return { ...prev, [split]: list };
         });
      }, [split]);

      const requestDeleteCustomExercise = (ex) => {
        setConfirmDialog({
          title: `Smazat vlastní cvik?`,
          text: `Cvik "${ex.name}" bude trvale smazán ze všech nabídek. Historické tréninky zůstanou nedotčeny.`,
          confirmText: 'Smazat trvale',
          isDanger: true,
          onConfirm: () => {
            setExercises(prev => prev.filter(e => e.id !== ex.id));
            setWorkoutState(prev => {
              const newState = { ...prev };
              for (const s of ['push', 'pull', 'legs', 'mix']) {
                newState[s] = (newState[s] || []).filter(item => item.id !== ex.id);
              }
              return newState;
            });
            setConfirmDialog(null);
            showToast('Cvik smazán.');
          }
        });
      };

      const updateExNote = (exId, noteVal) => {
        setExerciseNotes(prev => ({ ...prev, [exId]: noteVal }));
      };

      const generateSetsForExercise = (ex) => {
        const ghostSets = getGhostDataForExercise(ex.id);
        if (ghostSets) {
          return ghostSets.map((s, idx) => ({ id: idx + 1, weight: s.weight, reps: s.reps, rpe: 'Akorát' }));
        } else {
          return [{ id: 1, weight: 0, reps: 0, rpe: 'Akorát' }];
        }
      };

      const addExerciseToSplit = (ex) => {
        setWorkoutState(prev => {
          const list = prev[split] || [];
          if (list.some(x => x.id === ex.id)) {
            showToast('Cvik už máš v tréninku zařazený!');
            return prev;
          }
          return {
            ...prev,
            [split]: [{ id: ex.id, sets: generateSetsForExercise(ex) }, ...list]
          };
        });
        setAddModal(false);
      };

      const handleCreateCustomExercise = () => {
        if (!customName.trim()) return;
        const newEx = {
          id: 'custom_' + Date.now(), name: customName.trim(), category: customCategory, muscleGroup: customMuscle,
          isAnchor: false, isCounterweight: customIsCounterweight, repsTarget: '8-10', isCustom: true
        };
        setExercises(prev => [...prev, newEx]);
        addExerciseToSplit(newEx);
        setCustomName('');
      };

      const generateMagicWandWorkout = () => {
        const pool = split === 'mix' ? exercises : exercises.filter(e => e.category === split);
        let groups = [];
        
        if (split === 'push') {
           groups = [{ name: 'Hrudník', count: 3 }, { name: 'Ramena', count: 3 }, { name: 'Triceps', count: 3 }];
        } else if (split === 'pull') {
           groups = [{ name: 'Záda', count: 4 }, { name: 'Zadní ramena', count: 1 }, { name: 'Biceps', count: 3 }];
        } else if (split === 'legs') {
           groups = [{ name: 'Kvadricepsy', count: 3 }, { name: 'Hamstringy', count: 3 }, { name: 'Lýtka', count: 2 }];
        } else if (split === 'mix') {
           groups = [{ name: 'Hrudník', count: 2 }, { name: 'Záda', count: 2 }, { name: 'Kvadricepsy', count: 2 }];
        }

        const selected = [];
        const lastUsedMap = {};
        pool.forEach(e => lastUsedMap[e.id] = 0);
        history.forEach(hEntry => {
           const time = new Date(hEntry.date).getTime();
           hEntry.exercises.forEach(he => { if (!lastUsedMap[he.id] || time > lastUsedMap[he.id]) lastUsedMap[he.id] = time; });
        });

        groups.forEach(g => {
          const inGroup = pool.filter(e => e.muscleGroup === g.name);
          const anchor = inGroup.find(e => e.isAnchor);
          const rest = inGroup.filter(e => !e.isAnchor);
          if (anchor) selected.push(anchor);
          const sortedRest = [...rest].sort((a, b) => lastUsedMap[a.id] - lastUsedMap[b.id]);
          const needed = anchor ? g.count - 1 : g.count;
          selected.push(...sortedRest.slice(0, Math.max(0, needed)));
        });

        return selected;
      };

      const [wandProposed, setWandProposed] = useState([]);
      const openMagicWand = () => {
        setWandProposed(generateMagicWandWorkout());
        setWandModal(true);
      };

      const applyMagicWand = () => {
        const newSplitExercises = wandProposed.map(ex => ({ id: ex.id, sets: generateSetsForExercise(ex) }));
        setWorkoutState(prev => ({ ...prev, [split]: newSplitExercises }));
        setWandModal(false);
        showToast(`✨ Vygenerováno (Ghost data vložena)!`);
      };

      const requestFinishWorkout = () => {
        const currentList = workoutState[split] || [];
        
        const recordedExercises = currentList.map(item => {
          const exObj = exercises.find(e => e.id === item.id) || { name: item.id, isCounterweight: false };
          return {
            id: item.id, name: exObj.name, isCounterweight: exObj.isCounterweight,
            sets: item.sets.filter(s => (parseInt(s.reps, 10) || 0) > 0).map(s => ({
              weight: parseFloat(s.weight) || 0, reps: parseInt(s.reps, 10) || 0, rpe: s.rpe || 'Akorát'
            }))
          };
        }).filter(e => e.sets.length > 0);

        if (recordedExercises.length === 0) {
          showToast('Nemáš zapsanou žádnou platnou sérii (musí mít > 0 opakování).');
          return;
        }

        setConfirmDialog({
          title: 'Dokončit trénink?',
          text: `Uloží se všechny zapsané série.`,
          confirmText: 'Uložit a dokončit',
          isDanger: false,
          onConfirm: () => {

              id: 'w_' + Date.now(), date: new Date().toISOString(), split: split,
              sauna: { used: saunaUsed, mins: saunaMins ? parseInt(saunaMins, 10) : null },
              exercises: recordedExercises

            setHistory(prev => [newEntry, ...prev]);
            
            showToast('🎉 Trénink uložen! Nezapomeň si dát PROTEIN! 🥤');
            
            setConfirmDialog(null);
            setTab('history');
            setWorkoutState(prev => ({ ...prev, [split]: [] }));
            setSaunaUsed(false); setSaunaMins('');
          }
        });

      const exportData = () => {
        const payload = { exercises, workoutState, history, exerciseNotes };

        const dl = document.createElement('a');

        dl.setAttribute("download", `max_fitness_backup_${new Date().toISOString().slice(0,10)}.json`);

      const handleImportData = (e) => {
        const file = e.target.files[0];

                                </button>
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                <div className={`p-4 rounded-3xl border ${cardBg} space-y-3`}>
                  <div className="flex items-center justify-between">
                    <div><span className="font-bold text-sm block">🔥 Sauna po tréninku</span></div>
                    <button type="button" onClick={() => setSaunaUsed(!saunaUsed)} className={`w-12 h-7 rounded-full p-0.5 transition-colors ${saunaUsed ? 'bg-orange-500' : 'bg-zinc-700'}`}>
                      <div className={`w-6 h-6 rounded-full bg-white transition-transform ${saunaUsed ? 'translate-x-5' : 'translate-x-0'}`} />
                    </button>
                  </div>
                  {saunaUsed && <input type="number" inputMode="numeric" pattern="[0-9]*" value={saunaMins} onChange={(e) => setSaunaMins(e.target.value)} placeholder="Minut..." className={`w-full px-3 py-3 text-[14px] rounded-xl border ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-100 border-zinc-300'} outline-none`} />}
                </div>

                <button type="button" onClick={requestFinishWorkout} className="w-full py-4 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 text-white font-extrabold text-base shadow-lg shadow-orange-500/25 active:scale-98 transition-transform">
                  DOKONČIT TRÉNINK A DÁT SI PROTEIN
                </button>
              </div>
            )}

            {tab === 'history' && (
              <div className="space-y-4">
                <p className="text-[12px] text-zinc-400">Při kliknutí na ikonu tužky můžeš trénink upravit nebo smazat.</p>
                {history.length === 0 ? (
                  <div className={`p-8 text-center rounded-3xl border border-dashed ${isDark ? 'border-zinc-800 text-zinc-500' : 'border-zinc-300 text-zinc-400'}`}>Zatím nemáš dokončený žádný trénink.</div>
                ) : (
                  history.map(item => {
                    const dateObj = new Date(item.date);

                      <div key={item.id} className={`p-4 rounded-3xl border ${cardBg} space-y-3 relative group`}>

                          <div>
                            <span className="text-[11px] font-bold uppercase px-2 py-0.5 rounded-md bg-orange-500/20 text-orange-400 border border-orange-500/30">{item.split}</span>
                            <span className="text-[12px] text-zinc-400 ml-2">{formattedDate}</span>
                          </div>
                          <div className="flex items-center gap-2">
                            {item.sauna?.used && <span className="text-[11px] text-amber-400 font-semibold">🔥 Sauna {item.sauna.mins ? `${item.sauna.mins}m` : ''}</span>}
                            <button type="button" onClick={() => setEditHistoryModal(JSON.parse(JSON.stringify(item)))} className="p-2 -mr-2 -my-2 text-zinc-400 hover:text-white text-lg" title="Upravit nebo Smazat">✏️</button>
                          </div>

                        <div className="space-y-2">

                                {e.sets.map((s, sidx) => (

            {/* ZÁLOŽKA PROGRES S APPLE FITNESS KROUŽKY */}
            {tab === 'progress' && (

                   <ProgressRings history={history} />

            {tab === 'settings' && (
              <div className="space-y-4">
                <div className={`p-4 rounded-3xl border ${cardBg} space-y-4`}>

                      <div className={`w-6 h-6 rounded-full bg-white transition-transform ${theme === 'dark' ? 'translate-x-5' : 'translate-x-0'}`} />

                  <div className="flex items-center justify-between">

            <button type="button" onClick={() => setTab('history')} className={`flex flex-col items-center gap-1 text-[11px] font-semibold p-2 ${tab === 'history' ? 'text-orange-500' : 'text-zinc-500'}`}><span className="text-xl">📋</span> Historie</button>

              <div className={`w-full max-w-sm rounded-3xl border p-5 space-y-4 max-h-[85vh] flex flex-col ${cardBg}`}>
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <h3 className="font-bold text-base">Knihovna ({split.toUpperCase()})</h3>
                  <button type="button" onClick={() => setAddModal(false)} className="text-zinc-400 p-2 text-xl font-bold">✕</button>
                </div>

                <div className="overflow-y-auto flex-1 space-y-2 pr-1">
                  <span className="text-[12px] font-bold text-zinc-400 uppercase tracking-wider block">Vyber z nabídky:</span>
                  {filteredLibrary.map(ex => (
                    <div key={ex.id} className={`w-full p-2 rounded-2xl flex items-center justify-between ${subBg}`}>
                      <button type="button" onClick={() => addExerciseToSplit(ex)} className="flex-1 text-left text-[13px] font-semibold pr-2 py-1 active:scale-98">
                        <span className="font-bold text-zinc-200 block">{ex.name}</span>
                        <span className="text-[11px] text-zinc-400">{ex.muscleGroup} {ex.isCounterweight && '• Protiváha'}</span>
                      </button>
                      <div className="flex items-center gap-2">
                        {ex.isCustom && <button type="button" onClick={(e) => { e.stopPropagation(); requestDeleteCustomExercise(ex); }} className="text-[11px] text-red-400 px-2 py-1.5 bg-red-500/10 rounded-lg">Smazat</button>}
                        <button type="button" onClick={() => addExerciseToSplit(ex)} className="text-orange-400 text-2xl font-bold px-3 py-1 bg-orange-500/10 rounded-xl">+</button>
                      </div>
                    </div>
                  ))}

                  <div className="pt-5 border-t border-zinc-800 space-y-3 mt-2">
                    <span className="text-[12px] font-bold text-zinc-400 uppercase tracking-wider block">+ Vytvořit nový cvik:</span>
                    <input type="text" value={customName} onChange={(e) => setCustomName(e.target.value)} placeholder="Název cviku..." className={`w-full px-4 py-3 text-[14px] rounded-xl border ${isDark ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-100 border-zinc-300'} outline-none`} />
                    <div className="grid grid-cols-2 gap-2">
                      <select value={customCategory} onChange={(e) => setCustomCategory(e.target.value)} className={`px-3 py-3 text-[14px] rounded-xl border ${isDark ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-100 border-zinc-300'}`}>
                        <option value="push">Push</option><option value="pull">Pull</option><option value="legs">Legs</option>
                      </select>
                      <input type="text" value={customMuscle} onChange={(e) => setCustomMuscle(e.target.value)} placeholder="Sval (Hrudník...)" className={`px-4 py-3 text-[14px] rounded-xl border ${isDark ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-100 border-zinc-300'} outline-none`} />
                    </div>
                    <label className="flex items-center gap-3 text-[13px] text-zinc-300 pt-1 py-2">
                      <input type="checkbox" checked={customIsCounterweight} onChange={(e) => setCustomIsCounterweight(e.target.checked)} className="rounded w-5 h-5 accent-orange-500" />
                      <span>Stroj s dopomocí (protiváha)</span>
                    </label>
                    <button type="button" onClick={handleCreateCustomExercise} className="w-full py-3.5 bg-orange-500 text-white rounded-xl text-[14px] font-bold active:scale-95 shadow-md">Vytvořit a rovnou cvičit</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {wandModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className={`w-full max-w-sm rounded-3xl border p-5 space-y-4 max-h-[85vh] flex flex-col ${cardBg}`}>
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <div><h3 className="font-bold text-base flex items-center gap-1.5"><span>✨</span><span>Chytrý návrh ({split.toUpperCase()})</span></h3></div>
                  <button type="button" onClick={() => setWandModal(false)} className="text-zinc-400 p-2 text-xl font-bold">✕</button>
                </div>
                <div className="overflow-y-auto flex-1 space-y-2 pr-1">
                  <p className="text-[12px] text-zinc-400 pb-2">Vybrány cviky, které jsi nejdéle necvičil. (Budou vložena tvoje Ghost data).</p>
                  {wandProposed.map((ex, idx) => (
                    <div key={ex.id} className={`p-3 rounded-xl ${subBg} flex items-center justify-between text-[13px]`}>
                      <div><span className="font-bold text-zinc-200 block">{idx + 1}. {ex.name}</span><span className="text-[11px] text-zinc-400">{ex.muscleGroup} {ex.isAnchor ? '• ⭐ Kotva' : '• Doplňkový'}</span></div>
                    </div>
                  ))}
                </div>
                <div className="pt-3 flex gap-2">
                  <button type="button" onClick={() => setWandModal(false)} className="flex-1 py-3.5 bg-zinc-800 text-zinc-300 rounded-xl text-[14px] font-bold active:scale-95">Zrušit</button>
                  <button type="button" onClick={applyMagicWand} className="flex-1 py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-xl text-[14px] font-bold active:scale-95">Použít návrh</button>
                </div>
              </div>
            </div>
          )}

          {confirmDialog && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className={`w-full max-w-xs rounded-3xl border p-6 text-center space-y-4 ${cardBg}`}>
                <h3 className="font-bold text-lg">{confirmDialog.title}</h3>
                <p className="text-[13px] text-zinc-400">{confirmDialog.text}</p>
                <div className="flex gap-3 pt-2">
                  <button type="button" onClick={() => setConfirmDialog(null)} className="flex-1 py-3 bg-zinc-800 text-zinc-300 rounded-xl text-[14px] font-bold">Zrušit</button>
                  <button type="button" onClick={confirmDialog.onConfirm} className={`flex-1 py-3 rounded-xl text-[14px] font-bold text-white ${confirmDialog.isDanger ? 'bg-red-600' : 'bg-orange-500'}`}>{confirmDialog.confirmText}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
